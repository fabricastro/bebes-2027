<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Panel · Bebés 2027</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body class="admin">
    <header class="bar">
      <p class="bar__title stamped">Bebés 2027</p>
      <button class="bar__logout" type="button" id="logout" hidden>Salir</button>
    </header>

    <main class="sheet">
      <section class="login" id="login-view" hidden aria-labelledby="login-title">
        <h1 class="sheet__title" id="login-title">Panel de la lista</h1>
        <form class="login__form" id="login-form">
          <label class="label" for="password">Contraseña</label>
          <input class="input" id="password" type="password" autocomplete="current-password" required />
          <p class="error" id="login-error" role="alert"></p>
          <button class="primary" type="submit">Entrar</button>
        </form>
      </section>

      <section class="panel" id="panel-view" hidden aria-labelledby="panel-title">
        <div class="summary">
          <h1 class="sheet__title" id="panel-title">
            <span class="summary__count" id="total">0</span>
            <span id="total-noun">deseos</span>
          </h1>
          <p class="summary__status">
            Formulario <strong id="status-label">abierto</strong>
          </p>
        </div>

        <div class="actions">
          <button class="primary" type="button" id="download">Descargar PDF para imprimir</button>
          <button class="secondary" type="button" id="toggle">Cerrar formulario</button>
        </div>
        <p class="notice" id="notice" role="status" aria-live="polite"></p>

        <div class="list-head">
          <label class="label" for="search">Buscar</label>
          <input class="input" id="search" type="search" placeholder="Nombre" autocomplete="off" />
        </div>

        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th scope="col">Nombre</th>
                <th scope="col">Nacimiento</th>
                <th scope="col">Cargado</th>
                <th scope="col"><span class="visually-hidden">Acciones</span></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
          <p class="empty" id="empty" hidden>Todavía no hay nombres en la lista.</p>
        </div>
      </section>
    </main>

    <script src="/vendor/pdf-lib.min.js"></script>
    <script src="/vendor/fontkit.umd.min.js"></script>
    <script src="/admin.js" type="module"></script>
  </body>
</html>
